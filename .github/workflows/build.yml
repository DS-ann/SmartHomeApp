name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # ================= Checkout =================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ================= Java Setup =================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ================= Make Gradle Executable =================
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # ================= Build Debug APK =================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --daemon

      # ================= Upload APK Artifact =================
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RanjanaSmartHome-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      # ================= Generate index.html =================
     - name: Generate index.html for APK downloads
  run: |
    mkdir -p deploy
    cd deploy

    cat << 'EOF' > index.html
<!DOCTYPE html>
<html>
<head><title>Ranjana Smart Home APKs</title></head>
<body>
<h1>Available APKs (newest first)</h1>
<ul>
EOF

    # Copy APKs and add links
    for apk in $(ls -t ../app/build/outputs/apk/debug/*.apk); do
      size=$(du -h "$apk" | cut -f1)
      base=$(basename "$apk")
      cp "$apk" .
      echo "<li><a href=\"$base\">$base</a> ($size)</li>" >> index.html
    done

    cat << 'EOF' >> index.html
</ul>
</body>
</html>
EOF

    cd ..
      # ================= Upload deploy folder as artifact =================
      - name: Upload deploy folder as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RanjanaSmartHome-deploy
          path: deploy/

name: Ultra Fast Android Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # =========================================
      # Checkout
      # =========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================
      # Java 17
      # =========================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # =========================================
      # Gradle Cache
      # =========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # =========================================
      # Permission
      # =========================================

      - name: Grant Permission
        run: chmod +x gradlew

      # =========================================
      # Ultra Fast Build
      # =========================================

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
          --parallel \
          --build-cache \
          --configuration-cache \
          --daemon \
          -x lint \
          -x test

      # =========================================
      # Upload APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RanjanaSmartHome-APK
          path: app/build/outputs/apk/debug/app-debug.apk

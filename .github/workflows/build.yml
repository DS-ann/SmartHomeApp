name: Build & Artifact Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      # ================= Checkout =================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ================= Java Setup =================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ================= Make Gradle Executable =================
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # ================= Build APK =================
      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --daemon

      # ================= Prepare Deploy Folder =================
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy
          cp app/build/outputs/apk/debug/*.apk deploy/

      # ================= Generate index.html =================
      - name: Generate index.html for APK downloads
        run: |
          cd deploy
          echo "<!DOCTYPE html>" > index.html
          echo "<html>" >> index.html
          echo "<head><title>Ranjana Smart Home APKs</title></head>" >> index.html
          echo "<body>" >> index.html
          echo "<h1>Available APKs (newest first)</h1>" >> index.html
          echo "<ul>" >> index.html

          # List APKs newest first
          for apk in $(ls -t *.apk); do
            size=$(du -h "$apk" | cut -f1)
            echo "<li><a href=\"$apk\">$apk</a> ($size)</li>" >> index.html
          done

          echo "</ul>" >> index.html
          echo "</body>" >> index.html
          echo "</html>" >> index.html
          cd ..

      # ================= Upload Artifacts =================
      - name: Upload APKs & index.html as artifact
        uses: actions/upload-artifact@v4
        with:
          name: RanjanaSmartHome-APK
          path: deploy/
